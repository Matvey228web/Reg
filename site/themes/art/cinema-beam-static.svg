<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" preserveAspectRatio="none" width="240" height="360">
<!-- Луч проектора: мягкая трапеция и пылинки, плывущие вверх по лучу. -->
<defs>
