<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" preserveAspectRatio="none" width="240" height="360">
<!-- Луч проектора: мягкая трапеция и пылинки, плывущие вверх по лучу. -->
<defs>
<linearGradient id="v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1cf" stop-opacity=".55"/><stop offset=".6" stop-color="#ffe3a6" stop-opacity=".2"/><stop offset="1" stop-color="#ffe3a6" stop-opacity=".04"/></linearGradient>
<linearGradient id="w" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="k"><polygon points="92,0 138,0 238,360 -8,360" fill="url(#w)"/></mask>
<filter id="f" x="-20%" y="-5%" width="140%" height="110%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<g filter="url(#f)"><rect width="240" height="360" fill="url(#v)" mask="url(#k)"/></g>
<polygon points="104,0 128,0 182,360 52,360" fill="url(#v)" opacity=".55" filter="url(#f)"/>
<g fill="#fff6dc">
<circle cx="120" cy="330" r="1.6" opacity="0"><animate attributeName="cy" values="330;30" dur="11s" begin="0s" repeatCount="indefinite"/><animate attributeName="cx" values="120;110" dur="11s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;.15;.8;1" dur="11s" begin="0s" repeatCount="indefinite"/></circle>
<circle cx="70" cy="340" r="1.1" opacity="0"><animate attributeName="cy" values="340;30" dur="14s" begin="-4s" repeatCount="indefinite"/><animate attributeName="cx" values="70;100" dur="14s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;.15;.8;1" dur="14s" begin="-4s" repeatCount="indefinite"/></circle>
<circle cx="180" cy="320" r="1.3" opacity="0"><animate attributeName="cy" values="320;30" dur="12s" begin="-7s" repeatCount="indefinite"/><animate attributeName="cx" values="180;128" dur="12s" begin="-7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;.15;.8;1" dur="12s" begin="-7s" repeatCount="indefinite"/></circle>
<circle cx="150" cy="300" r="0.9" opacity="0"><animate attributeName="cy" values="300;30" dur="16s" begin="-2s" repeatCount="indefinite"/><animate attributeName="cx" values="150;118" dur="16s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;.15;.8;1" dur="16s" begin="-2s" repeatCount="indefinite"/></circle>
<circle cx="95" cy="350" r="1.4" opacity="0"><animate attributeName="cy" values="350;30" dur="13s" begin="-9s" repeatCount="indefinite"/><animate attributeName="cx" values="95;108" dur="13s" begin="-9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;.15;.8;1" dur="13s" begin="-9s" repeatCount="indefinite"/></circle>
<circle cx="205" cy="340" r="1.0" opacity="0"><animate attributeName="cy" values="340;30" dur="17s" begin="-12s" repeatCount="indefinite"/><animate attributeName="cx" values="205;132" dur="17s" begin="-12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;.15;.8;1" dur="17s" begin="-12s" repeatCount="indefinite"/></circle>
<circle cx="135" cy="290" r="0.8" opacity="0"><animate attributeName="cy" values="290;30" dur="10s" begin="-5s" repeatCount="indefinite"/><animate attributeName="cx" values="135;114" dur="10s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;.15;.8;1" dur="10s" begin="-5s" repeatCount="indefinite"/></circle>
</g>
</svg>
