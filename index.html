<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mifs Rent — учёт оборудования</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/vendor/qrcode-generator.js"></script>
</head>
<body>
<div id="app">

  <!-- Кнопка «назад» внутри страницы. Нативная BackButton Telegram живёт в шапке,
       её легко не заметить, а на клиентах старее Bot API 6.1 её нет вовсе —
       и тогда уйти с экрана было бы нечем. Роутер показывает её на неглавных экранах. -->
  <div class="back-row" id="back-row" style="display:none;">
    <button class="back-btn" id="back-button">← Назад</button>
  </div>

  <!-- Экран: вход по PIN -->
  <div class="screen" id="screen-login">
    <h1>Mifs Rent</h1>
    <p class="hint" id="login-greeting">Учёт оборудования на складе</p>
    <div id="login-error"></div>
    <form id="login-form">
      <div class="field">
        <label for="login-input">Логин</label>
        <input id="login-input" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required />
      </div>
      <div class="field">
        <label for="pin-input">PIN-код</label>
        <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn" id="login-submit">Войти</button>
    </form>

  </div>

  <!-- Экран: главное меню -->
  <div class="screen" id="screen-home">
    <h1>Mifs Rent</h1>
    <div class="top-user" id="home-user"></div>

    <!-- Разделы живут в нижней панели, дублировать их карточками здесь не нужно.
         Главная — это кабинет: кто вошёл и что он может настроить. -->
    <div class="menu-grid">
      <div class="card" data-nav="staff" id="home-staff-card" style="display:none;">
        <div class="card-title">🗝 Сотрудники</div>
      </div>
      <div class="card" data-nav="settings" id="home-settings-card" style="display:none;">
        <div class="card-title">⚙️ Настройки</div>
      </div>
    </div>
    <button class="btn btn--secondary" id="pin-change-btn" style="margin-top:20px;">Сменить свой PIN</button>
    <button class="btn btn--secondary" id="logout-btn" style="margin-top:8px;">Выйти</button>
  </div>

  <!-- Экран: каталог оборудования -->
  <div class="screen" id="screen-catalog">
    <h1>Каталог</h1>
    <div class="filters">
      <select id="catalog-filter-category"></select>
      <select id="catalog-filter-status"></select>
    </div>
    <div class="field" id="catalog-search-wrap">
      <input type="search" id="catalog-search" placeholder="Поиск по названию или номеру"
             autocapitalize="off" autocorrect="off" spellcheck="false" />
    </div>
    <!-- Кнопка стоит ДО списка и липнет при прокрутке: раньше она была после
         списка и на 628 карточках уезжала под них — найти её было невозможно. -->
    <button class="btn btn--secondary btn--sticky" id="catalog-add-toggle">+ Добавить оборудование</button>

    <div id="catalog-add-form" style="display:none;" class="section">
      <h2>Новое оборудование</h2>
      <div id="catalog-add-error"></div>
      <div class="field">
        <label for="new-item-category">Категория</label>
        <select id="new-item-category"></select>
      </div>
      <div class="field">
        <label for="new-item-model">Модель</label>
        <select id="new-item-model"></select>
      </div>
      <div class="field" id="new-model-wrap" style="display:none;">
        <label for="new-item-name">Название новой модели</label>
        <input id="new-item-name" type="text" />
      </div>
      <div class="field">
        <label for="new-item-serial">Серийный номер</label>
        <input id="new-item-serial" type="text" />
      </div>
      <div class="field">
        <label for="new-item-inventory">Инвентарный номер</label>
        <input id="new-item-inventory" type="text" />
      </div>
      <div class="field">
        <label for="new-item-notes">Заметки о состоянии</label>
        <textarea id="new-item-notes"></textarea>
      </div>
      <button class="btn" id="new-item-submit">Создать и получить QR</button>
    </div>

    <div id="catalog-qr-result" class="section" style="display:none;"></div>
    <div id="catalog-list"></div>
    <div id="catalog-more"></div>
  </div>

  <!-- Экран: сканирование -->
  <div class="screen" id="screen-scan">
    <h1>Сканировать</h1>
    <div id="scan-error"></div>
    <div id="scan-result"></div>
    <button class="btn btn--secondary" id="scan-start-btn">📷 Сканировать ещё раз</button>
    <div class="field" id="scan-manual-wrap">
      <label for="scan-manual-input">Или введите номер вручную</label>
      <input type="text" id="scan-manual-input" inputmode="numeric" placeholder="010101" />
      <button class="btn btn--secondary" id="scan-manual-submit" style="margin-top:8px;">Найти</button>
    </div>
  </div>

  <!-- Экран: карточка предмета -->
  <div class="screen" id="screen-item">
    <h1 id="item-title">Оборудование</h1>
    <div id="item-content"></div>
  </div>

  <!-- Экран: ремонт/дефекты -->
  <div class="screen" id="screen-repair">
    <h1>Ремонт</h1>
    <div class="filters">
      <select id="repair-filter-status">
        <option value="all">Все</option>
        <option value="Open">Открытые</option>
        <option value="In Repair">В ремонте</option>
        <option value="Resolved">Решённые</option>
      </select>
    </div>
    <div id="repair-list"></div>
  </div>

  <!-- Экран: клиенты/проекты -->
  <div class="screen" id="screen-clients">
    <h1>Клиенты</h1>
    <div id="clients-list"></div>
    <button class="btn btn--secondary" id="clients-add-toggle" style="margin-top:6px;">+ Добавить клиента</button>

    <div id="clients-add-form" style="display:none;" class="section">
      <h2>Новый клиент</h2>
      <div id="clients-add-error"></div>
      <div class="field">
        <label for="new-client-name">Имя / компания</label>
        <input id="new-client-name" type="text" required />
      </div>
      <div class="field">
        <label for="new-client-project">Проект</label>
        <input id="new-client-project" type="text" />
      </div>
      <div class="field">
        <label for="new-client-phone">Телефон</label>
        <input id="new-client-phone" type="text" />
      </div>
      <button class="btn" id="new-client-submit">Добавить</button>
    </div>
  </div>

  <!-- Экран: сотрудники (только для Admin) -->
  <div class="screen" id="screen-staff">
    <h1>Сотрудники</h1>
    <div id="staff-list"></div>
    <button class="btn btn--secondary" id="staff-add-toggle" style="margin-top:6px;">+ Добавить сотрудника</button>

    <div id="staff-add-form" style="display:none;" class="section">
      <h2>Новый сотрудник</h2>
      <div id="staff-add-error"></div>
      <div class="field">
        <label for="new-staff-name">Имя</label>
        <input id="new-staff-name" type="text" required />
      </div>
      <div class="field">
        <label for="new-staff-login">Логин</label>
        <input id="new-staff-login" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" required />
      </div>
      <div class="field">
        <label for="new-staff-pin">PIN-код</label>
        <input id="new-staff-pin" type="password" inputmode="numeric" pattern="[0-9]*" required />
      </div>
      <div class="field">
        <label for="new-staff-role">Роль</label>
        <select id="new-staff-role">
          <option value="Warehouse Staff">Сотрудник склада</option>
          <option value="Admin">Администратор</option>
        </select>
      </div>
      <button class="btn" id="new-staff-submit">Добавить</button>
    </div>
  </div>

  <!-- Экран: настройки системы (только администратор) -->
  <div class="screen" id="screen-settings">
    <h1>Настройки</h1>
    <div id="settings-error"></div>
    <div id="settings-content"></div>
  </div>

  <!-- Экран: смена своего PIN (доступен любой роли) -->
  <div class="screen" id="screen-pin">
    <h1>Смена PIN</h1>
    <div id="pin-change-error"></div>
    <p class="hint" id="pin-change-hint">Новый PIN — от 4 до 6 цифр.</p>
    <div class="field">
      <label for="pin-current">Текущий PIN</label>
      <input id="pin-current" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" />
    </div>
    <div class="field">
      <label for="pin-new">Новый PIN</label>
      <input id="pin-new" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="new-password" />
    </div>
    <div class="field">
      <label for="pin-repeat">Новый PIN ещё раз</label>
      <input id="pin-repeat" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="new-password" />
    </div>
    <button class="btn" id="pin-change-submit">Сменить PIN</button>
  </div>

  <!-- Панель разделов: переход между разделами в один тап, без возврата на главную.
       «Сотрудники» сюда не ставим — раздел админский и редкий, он на главной. -->
  <nav class="tabbar" id="tabbar" style="display:none;">
    <button class="tab" data-tab="home"><span class="tab-ico">🏠</span>Главная</button>
    <button class="tab" data-tab="catalog"><span class="tab-ico">📦</span>Каталог</button>
    <button class="tab" data-tab="scan"><span class="tab-ico">📷</span>Скан</button>
    <button class="tab" data-tab="repair"><span class="tab-ico">🛠</span>Ремонт</button>
    <button class="tab" data-tab="clients"><span class="tab-ico">👥</span>Клиенты</button>
  </nav>

</div>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/telegram.js"></script>
<script src="js/router.js"></script>
<script src="js/qr.js"></script>
<script src="js/swipe.js"></script>
<script src="js/auth.js"></script>
<script src="js/catalog.js"></script>
<script src="js/scan.js"></script>
<script src="js/item.js"></script>
<script src="js/repair.js"></script>
<script src="js/clients.js"></script>
<script src="js/staff.js"></script>
<script src="js/settings.js"></script>
<script src="js/pin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
