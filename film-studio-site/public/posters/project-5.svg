<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Кадр-заглушка">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a331a"/>
      <stop offset="60%" stop-color="#12100a"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="v" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <g opacity="0.35">
    <circle cx="1180" cy="300" r="220" fill="#d8c07f" opacity="0.18"/>
    <circle cx="420" cy="650" r="300" fill="#d8c07f" opacity="0.10"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.10"/>
  <rect width="1600" height="900" fill="url(#v)"/>
  <g fill="none" stroke="#d8c07f" stroke-opacity="0.45" stroke-width="3">
    <path d="M60 60 h90 M60 60 v90"/>
    <path d="M1540 60 h-90 M1540 60 v90"/>
    <path d="M60 840 h90 M60 840 v-90"/>
    <path d="M1540 840 h-90 M1540 840 v-90"/>
  </g>
</svg>